name: Verify release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: verify-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      ARCHIVE: EXGEP-v1.0.0-linux-x86_64-py39.tar.gz
    steps:
      - name: Validate requested tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Download draft or published release assets
        shell: bash
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern "$ARCHIVE" --pattern SHA256SUMS.txt
      - name: Verify checksum and archive structure
        shell: bash
        run: |
          cd assets
          grep -F "  $ARCHIVE" SHA256SUMS.txt | sha256sum --check --strict
          test "$(grep -F -c "  $ARCHIVE" SHA256SUMS.txt)" -eq 1
          tar -tzf "$ARCHIVE" | grep -q '^EXGEP-v1.0.0/README.md$'
          if tar -tzf "$ARCHIVE" | grep -Eq '\.pyd$|(^|/)setup\.py$|docs/superpowers'; then exit 1; fi
          tar -xzf "$ARCHIVE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: x64
          cache: pip
          cache-dependency-path: assets/EXGEP-v1.0.0/requirements.txt
      - name: Install locked dependencies
        shell: bash
        working-directory: assets/EXGEP-v1.0.0
        run: python -m pip install --requirement requirements.txt
      - name: Import, data, and example smoke tests
        shell: bash
        working-directory: assets/EXGEP-v1.0.0
        run: |
          python -c "import exgep; from exgep.model import RegEXGEP; from exgep.data import datautils; from exgep.data.reg_metrics import r2_score; print(exgep.__version__)"
          python -c "from exgep.data import datautils; d=datautils.merge_data('data/genotype.csv','data/pheno.csv','data/soil.csv','data/weather.csv'); assert len(d)>0; print(d.shape)"
          python test_exgep.py --help
          python test_explain.py --help

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      ARCHIVE: EXGEP-v1.0.0-windows-x86_64-py39.zip
    steps:
      - name: Validate requested tag
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid tag' }
      - name: Download draft or published release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path assets | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir assets `
            --pattern $env:ARCHIVE --pattern SHA256SUMS.txt
      - name: Verify checksum and archive structure
        shell: pwsh
        run: |
          $line = Get-Content assets\SHA256SUMS.txt | Where-Object { $_ -match [regex]::Escape("  $env:ARCHIVE") }
          if (@($line).Count -ne 1) { throw 'Expected exactly one checksum entry' }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "assets\$env:ARCHIVE" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'SHA-256 mismatch' }
          Expand-Archive "assets\$env:ARCHIVE" -DestinationPath assets
          if (Get-ChildItem assets\EXGEP-v1.0.0 -Recurse -File | Where-Object { $_.Extension -eq '.so' -or $_.Name -eq 'setup.py' -or $_.FullName -match 'docs[\\/]superpowers' }) { throw 'Forbidden archive content' }
          if (-not (Test-Path assets\EXGEP-v1.0.0\README.md)) { throw 'README.md missing' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: x64
          cache: pip
          cache-dependency-path: assets/EXGEP-v1.0.0/requirements.txt
      - name: Install locked dependencies
        shell: pwsh
        working-directory: assets/EXGEP-v1.0.0
        run: python -m pip install --requirement requirements.txt
      - name: Import, data, and example smoke tests
        shell: pwsh
        working-directory: assets/EXGEP-v1.0.0
        run: |
          python -c "import exgep; from exgep.model import RegEXGEP; from exgep.data import datautils; from exgep.data.reg_metrics import r2_score; print(exgep.__version__)"
          python -c "from exgep.data import datautils; d=datautils.merge_data('data/genotype.csv','data/pheno.csv','data/soil.csv','data/weather.csv'); assert len(d)>0; print(d.shape)"
          python test_exgep.py --help
          python test_explain.py --help
